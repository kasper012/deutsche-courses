url = "/signup"
layout = "default"
title = "Sign up"

[account]
redirect = "registration/profile"
paramCode = "code"
activationPage = "registration/profile"
forceSecure = 0
requirePassword = 0
==
<div class="back-wrapper">
    <div class="back-wrapper-inner">
        <div class="back-login-page back-signup-page pt-120 pb-120">
            <div class="container">
                <div class="row align-center">
                    <div class="col-lg-6">
                        <div class="login-left-content">
                            <h1>Create a <br>Free Account.</h1>
                            <Full Namep>I'm a subhead that goes with a story.</p>
                            <img src="{{'assets/images/login/2.png'| theme}}" alt="login">
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="login-right-form">
                            {% component 'account'%}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
