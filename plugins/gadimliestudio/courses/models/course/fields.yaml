# ===================================
#  Form Field Definitions
# ===================================

fields:
    id:
        label: ID
        disabled: true
        hidden: true

    teacher_name:
        label: Teacher name
        span: storm 
        cssClass: col-md-4
    price:
        label: Course price
        span: storm 
        cssClass: col-md-4
    stars: 
        label: Stars
        type: number
        min: 0
        max: 5
        step: 0.1
        span: storm 
        cssClass: col-md-4
    students:
        label: Number of students
        span: storm 
        cssClass: col-md-6
    teachers_img:
        type: mediafinder
        label: Teacher's image
        span: storm
        cssClass: col-md-6
    courses_img: 
        type: mediafinder
        label: Course image
    exerpt:
        type: richeditor
        label: Courses exerpt
    course_type:
        label: Course type






    

