# ===================================
#  Form Field Definitions
# ===================================

fields:
    id:
        label: ID
        disabled: true
        hidden: true

    teacher_name:
        label: Teacher name
        span: storm 
        cssClass: col-md-4
    price:
        label: Course price
        span: storm 
        cssClass: col-md-4
    stars: 
        label: Stars
        type: number
        min: 0
        max: 5
        step: 0.1
        span: storm 
        cssClass: col-md-4
    students:
        label: Number of students
        span: storm 
        cssClass: col-md-6
    teachers_img:
        type: mediafinder
        label: Teacher's image
        span: storm
        cssClass: col-md-6
    courses_img: 
        type: mediafinder
        label: Course image
        span: storm
        cssClass: col-md-6
    title:
        label: Courses name
        span: storm
        cssClass: col-md-6
    course_type:
        label: Course type
        span: storm
        cssClass: col-md-6
    last_update:
        label: Last Update
        type: datepicker
        mode: date
        span: storm
        cssClass: col-md-6
    about:
        type: richeditor
        label: About text
    lectures: 
        type: number
        label: Number of lectures
        step: 1
        span: storm
        cssClass: col-md-4
    language:
        type: dropdown
        label: Language
        default: english
        options:
            russian: Russian
            english: English
            azerbaijani: Azerbaijan
        span: storm
        cssClass: col-md-4
    duration:
        label: Duration
        span: storm
        cssClass: col-md-4
    





    

