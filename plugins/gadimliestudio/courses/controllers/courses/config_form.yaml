# ===================================
#  Form Behavior Config
# ===================================

# Record name
name: Course

# Model Form Field configuration
form: $/gadimliestudio/courses/models/course/fields.yaml

# Model Class name
modelClass: Gadimliestudio\Courses\Models\Course

# Default redirect location
defaultRedirect: gadimliestudio/courses/courses

# Create page
create:
    title: New course
    redirect: gadimliestudio/courses/courses/update/:id
    redirectClose: gadimliestudio/courses/courses

# Update page
update:
    title: Change the course
    redirect: gadimliestudio/courses/courses
    redirectClose: gadimliestudio/courses/courses

# Preview page
preview:
    title: Show
