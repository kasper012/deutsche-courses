
<!-- our contact -->
<form class="" id="contact-form" action="#" style="border:none;" method="post" data-request="{{ __SELF__ }}::onSend"  data-request-success="formSuccess(this, context, data, textStatus, jqXHR)" data-request-validate data-request-flash>
  <div class="row">
    <div class="col-lg-6">
        <div class="back-input">
            <input id="name" type="text" name="name" placeholder="Name">
        </div>
    </div>

    <div class="col-lg-6 pdl-5">
        <div class="back-input">
            <input id="email" type="email" name="email" placeholder="Email">                          
        </div>
    </div>
    
    <div class="col-lg-6">
        <div class="back-input">
            <input id="subject" type="text" name="subject" placeholder="Subject">                          
        </div>
    </div>

    <div class="col-lg-6 pdl-5">
        <div class="back-input">
            <input id="phone" type="tel" name="phone" placeholder="Phone">                   
        </div>
    </div>

    <div class="col-lg-12">
        <div class="back-textarea">
            <textarea id="message" type="text" name="msg" placeholder="Message"></textarea>
        </div>
    </div>

    <div class="col-lg-12">                                                
        <button type="submit" class="back-btn">Send your Message</button>
    </div>
</div>     
</form>

<script>
    function formSuccess(form, context, data, textStatus, jqXHR) {
       if(data['status'] != 200) 
           status = 'error'; 
           else {
               form.reset();
               status = 'success'; 
           }
       $.oc.flashMsg({
           'text': data['msg'],
           'class': status,
           'interval': 3
       });
    }
</script>
