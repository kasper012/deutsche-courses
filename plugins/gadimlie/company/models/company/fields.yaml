tabs:
    fields:
    #Info
        phone:
            tab: Info
            label: Phone number
            span: storm
            cssClass: col-md-6

        address:
            tab: Info
            label: Address
            span: storm
            cssClass: col-md-6
        email: 
            tab: Info
            type: email
            label: Email

#Events
        event: 
            tab: Events
            prompt: New event
            type: repeater
            form:
                fields:
                    start_date:
                        type: datepicker
                        label: Start date
                        span: storm
                        cssClass: col-md-6
                        default: now
                    finish_date:
                        type: datepicker
                        label: Finish date
                        span: storm
                        cssClass: col-md-6
                        default: now 
                    event_name: 
                        label: Events name
                    city: 
                        label: City
#Testimonials
        testimonials:
            tab: Testimonials
            prompt: New testimonial
            type: repeater
            form: 
                fields:
                    name:
                        label: Name
                    text:
                        type: textarea
                        size: large
                        label: Testimonial
                    profession:
                        label: Profession
                    image: 
                        type: mediafinder
                        label: Image
                        span: storm
                        cssClass: col-md-6
                    stars: 
                        type: number
                        label: Stars
                        step: 0.1
                        min: 0
                        max: 5
                        span: storm
                        cssClass: col-md-6
        about_title:
            tab: About Section
            label: About title
            type: richeditor
            span: storm
            cssClass: col-md-6
        about_subtitle:
            tab: About Section
            label: About subtitle
            type: richeditor
            span: storm
            cssClass: col-md-6
        image:
            tab: About Section
            label: About image
            type: mediafinder
        about_icons:
            tab: About Section
            label: Icons
            type: repeater
            prompt: New logo
